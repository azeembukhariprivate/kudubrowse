name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/KUDUBROWSE/KUDUBROWSE.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}".TrimStart('v', 'V') }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Is this a new version?
        id: rel
        shell: pwsh
        run: |
          # A push to main whose version has no tag yet gets a release of its own.
          $new = "false"
          # Versions below 1.0 are the browser being built step by step: they're built and tested, never released.
          if ("${{ steps.ver.outputs.version }}".StartsWith("0.")) { Write-Host "Version 0.x: not released." }
          elseif ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | Out-Null
            if ($LASTEXITCODE -eq 2) { $new = "true" }
            elseif ($LASTEXITCODE -ne 0) { Write-Host "Couldn't check the tags (exit code $LASTEXITCODE); no release this time." }
          }
          "new=$new" >> $env:GITHUB_OUTPUT
          Write-Host "New release: $new"
          $global:LASTEXITCODE = 0

      - name: Shared code matches kudu-common
        shell: pwsh
        run: |
          # The shared files come from https://github.com/azeembukhariprivate/kudu-common and mustn't be edited here.
          $sha = (Select-String -Path .kudu-common -Pattern '^commit (\S+)').Matches[0].Groups[1].Value
          git clone -q https://github.com/azeembukhariprivate/kudu-common "$env:RUNNER_TEMP/kudu-common"
          git -C "$env:RUNNER_TEMP/kudu-common" checkout -q $sha
          if ($LASTEXITCODE -ne 0) { Write-Host "kudu-common has no commit $sha"; exit 1 }
          python "$env:RUNNER_TEMP/kudu-common/sync.py" --check .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C "$env:RUNNER_TEMP/kudu-common" diff --quiet $sha origin/main -- shared
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::kudu-common has newer shared code than this app; run its sync.py." }
          $global:LASTEXITCODE = 0

      - name: Download the block lists that come with the app
        shell: pwsh
        run: |
          # The official address first, then a copy. EasyList and EasyPrivacy are needed; the cookie list is used when it can be fetched.
          $lists = @(
            @{ file = "easylist.txt"; need = $true; urls = @("https://easylist.to/easylist/easylist.txt", "https://raw.githubusercontent.com/easylist/easylist/gh-pages/easylist.txt") },
            @{ file = "easyprivacy.txt"; need = $true; urls = @("https://easylist.to/easylist/easyprivacy.txt", "https://raw.githubusercontent.com/easylist/easylist/gh-pages/easyprivacy.txt") },
            @{ file = "easylist-cookie.txt"; need = $false; urls = @("https://secure.fanboy.co.nz/fanboy-cookiemonster.txt", "https://easylist-downloads.adblockplus.org/easylist-cookie.txt") }
          )
          New-Item -ItemType Directory -Force src/KUDUBROWSE/Lists | Out-Null
          foreach ($l in $lists) {
            $ok = $false
            foreach ($u in $l.urls) {
              try {
                $text = (Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 60).Content
                if ($text -is [byte[]]) { $text = [System.Text.Encoding]::UTF8.GetString($text) }
                if ($text.TrimStart([char]0xFEFF).StartsWith("[Adblock")) {
                  [System.IO.File]::WriteAllText("src/KUDUBROWSE/Lists/$($l.file)", $text, [System.Text.UTF8Encoding]::new($false))
                  Write-Host "$($l.file): $(($text -split "`n").Count) lines from $u"
                  $ok = $true
                  break
                }
              } catch { Write-Host "$($l.file): couldn't fetch $u ($($_.Exception.Message))" }
            }
            if (-not $ok -and $l.need) { Write-Host "::error::Couldn't download $($l.file)"; exit 1 }
            if (-not $ok) { Write-Host "::warning::Couldn't download $($l.file); the app will fetch it when it runs." }
          }

      - name: Test the address bar, saving tabs and blocking (with the real lists)
        shell: pwsh
        run: dotnet run --project tests/KUDUBROWSE.Tests -c Release

      - name: Build
        shell: pwsh
        run: dotnet build src/KUDUBROWSE/KUDUBROWSE.csproj -c Release "-p:Version=${{ steps.ver.outputs.version }}" -o out/KUDUBROWSE

      - name: Make sure the Edge engine (WebView2 Runtime) is installed
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          if (Test-Path $key) { Write-Host "WebView2 Runtime $((Get-ItemProperty $key).pv)" }
          else { choco install webview2-runtime -y --no-progress }

      - name: Self-test the browser (typing addresses, links, back and forward, new tabs and pop-ups, closed tabs, zoom, blocking ads and pop-ups, allowing a site, tabs coming back, both themes)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $p = Start-Process -FilePath out/KUDUBROWSE/KUDUBROWSE.exe -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(540000)) { $p.Kill(); Write-Host "Self-test timed out"; Get-Content out/KUDUBROWSE/self-test.log -ErrorAction SilentlyContinue; exit 1 }
          Get-Content out/KUDUBROWSE/self-test.log -ErrorAction SilentlyContinue
          Remove-Item out/KUDUBROWSE/self-test.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Host "Self-test failed with exit code $($p.ExitCode)"; exit 1 }

      - name: Keep the screenshots the self-test took
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: KUDUBROWSE-screenshots-${{ steps.ver.outputs.version }}
          path: out/KUDUBROWSE/screenshots/*.png
          if-no-files-found: warn

      - name: Leave the screenshots out of the app
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force out/KUDUBROWSE/screenshots -ErrorAction SilentlyContinue

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem -Recurse out/KUDUBROWSE | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Make portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path out/KUDUBROWSE/* -DestinationPath "artifacts/KUDUBROWSE-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Make installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\out\KUDUBROWSE" "/O$PWD\artifacts" installer\KUDUBROWSE.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build files
        uses: actions/upload-artifact@v6
        with:
          name: KUDUBROWSE-${{ steps.ver.outputs.version }}
          path: artifacts/*

      - name: Add a copy of the installer without the version in its name
        if: github.ref_type == 'tag' || steps.rel.outputs.new == 'true'
        shell: pwsh
        run: Copy-Item "artifacts/KUDUBROWSE-${{ steps.ver.outputs.version }}-setup.exe" "artifacts/KUDUBROWSE-setup.exe"

      - name: Publish GitHub release
        if: github.ref_type == 'tag' || steps.rel.outputs.new == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $files = (Get-ChildItem artifacts/*).FullName
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $files --clobber }
          else { gh release create $tag $files --target "${{ github.sha }}" --title "KUDUBROWSE ${{ steps.ver.outputs.version }}" --generate-notes }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Give the latest release a copy of the installer without the version in its name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rel.outputs.new != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The README's download button links to releases/latest/download/KUDUBROWSE-setup.exe.
          $json = gh release view --json tagName,assets 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $json) { Write-Host "No release yet."; $global:LASTEXITCODE = 0; exit 0 }
          $latest = $json | ConvertFrom-Json
          $names = @($latest.assets | ForEach-Object { $_.name })
          if ($names -contains "KUDUBROWSE-setup.exe") { Write-Host "$($latest.tagName) already has KUDUBROWSE-setup.exe."; exit 0 }
          $versioned = $names | Where-Object { $_ -like "KUDUBROWSE-*-setup.exe" } | Select-Object -First 1
          if (-not $versioned) { Write-Host "$($latest.tagName) has no installer."; exit 0 }
          New-Item -ItemType Directory -Force latest | Out-Null
          gh release download $latest.tagName --pattern $versioned --dir latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "latest/$versioned" latest/KUDUBROWSE-setup.exe
          gh release upload $latest.tagName latest/KUDUBROWSE-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
